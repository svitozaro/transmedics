{% extends "base.html" %}{% block title %}First-time setup{% endblock %}{% block mainclass %}narrow{% endblock %}
{% block body %}
<h1>Welcome</h1>
<p>This is the first time the scheduler has started. Create the first admin account. You will add pilots and other admins after this.</p>
<form method="post" class="card">
  <input type="hidden" name="csrf" value="{{ csrf_token }}">
  <label>First name <input name="first_name" required></label>
  <label>Last name <input name="last_name" required></label>
  <label>Email (your @transmedics.com address) <input name="email" type="email" required></label>
  <label>Password (at least 10 characters, letters and numbers) <input name="password" type="password" autocomplete="new-password" required></label>
  <label>Password again <input name="confirm" type="password" autocomplete="new-password" required></label>
  <button>Create admin account</button>
</form>
{% endblock %}
