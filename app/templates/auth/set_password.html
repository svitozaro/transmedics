{% extends "base.html" %}{% block title %}Set password{% endblock %}{% block mainclass %}narrow{% endblock %}
{% block body %}
<h1>Choose a password</h1>
<p>Account: <strong>{{ user.email }}</strong></p>
<form method="post" class="card">
  <input type="hidden" name="csrf" value="{{ csrf_token }}">
  <label>New password (at least 10 characters, letters and numbers) <input name="password" type="password" autocomplete="new-password" required autofocus></label>
  <label>New password again <input name="confirm" type="password" autocomplete="new-password" required></label>
  <button>Save and sign in</button>
</form>
{% endblock %}
