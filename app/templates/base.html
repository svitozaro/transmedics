<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Vacation Scheduler{% endblock %} · Transmedics</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="top">
  <a class="brand" href="{{ url_for('auth.home') }}">Pilot Vacation Scheduler</a>
  {% if me %}
  <nav>
    {% if me.is_admin %}
      <a href="{{ url_for('admin.scheduler') }}">Scheduler</a>
      <a href="{{ url_for('admin.users') }}">Users</a>
      <a href="{{ url_for('admin.settings_page') }}">Settings</a>
      <a href="{{ url_for('admin.outbox') }}">Outbox</a>
    {% else %}
      <a href="{{ url_for('pilot.ranking') }}">My vacation</a>
    {% endif %}
    <a href="{{ url_for('auth.change_password') }}">Password</a>
    <form method="post" action="{{ url_for('auth.logout') }}" class="inline">
      <input type="hidden" name="csrf" value="{{ csrf_token }}">
      <button class="link">Sign out ({{ me.first_name or me.email }})</button>
    </form>
  </nav>
  {% endif %}
</header>
<main class="{% block mainclass %}{% endblock %}">
  {% for cat, msg in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ cat }}">{{ msg }}</div>
  {% endfor %}
  {% block body %}{% endblock %}
</main>
</body>
</html>
